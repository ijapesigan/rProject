  output-dir: quarto

book:
  title: "rProject"
  author: "Ivan Jacob Agaloos Pesigan"
  date: today
  search: true
  repo-url: https://github.com/ijapesigan/rProject
  repo-actions: [edit]
  site-url: https://ijapesigan.github.io/rProject/quarto/index.html
  page-footer:
    left: "Ivan Jacob Agaloos Pesigan, [Department of Human Development and Family Studies](https://hhd.psu.edu/hdfs), The Pennsylvania State University"
  sidebar:
