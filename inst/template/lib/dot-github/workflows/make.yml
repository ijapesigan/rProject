name: Make Project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      latest:
        description: "Run in the latest image and packages, not the lock's"
        type: boolean
        default: false

jobs:

  # the image and packages of the release (.setup/scripts/rproject.lock);
  # a scheduled run, or a manual run with latest, uses the latest
  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lock.outputs.image }}
      snapshot: ${{ steps.lock.outputs.snapshot }}
      r_version: ${{ steps.lock.outputs.r_version }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .setup/scripts
      -
        name: Read the lock
        id: lock
        env:
          EVENT: ${{ github.event_name }}
          LATEST: ${{ inputs.latest }}
        run: bash .setup/scripts/image-lock.sh

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      RPROJECT_SNAPSHOT: ${{ needs.image.outputs.snapshot }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
      statuses: write

    steps:
      -
        name: Checkout 
        uses: actions/checkout@v5
      -
        name: Clean
        run: |
          make clean
      -
        name: Make Library
        run: |
          rm -rf .setup/latex/bib/bib.bib
          make bib
          make push
          rm -rf .setup/latex/bib/bib.bib
      - 
        name: Commit and push changes
        uses: devops-infra/action-commit-push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "Automated build."
      -
        name: Make LaTeX
        run: |
          rm -rf .setup/latex/bib/bib.bib
          make bib
          make pdf
          rm -rf .setup/latex/bib/bib.bib
      - 
        name: Push to the latex branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: latex
          FOLDER: .setup/latex/pdf
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Make quarto
        run: |
          rm -rf .setup/latex/bib/bib.bib
          make bib
          make quarto
          rm -rf .setup/latex/bib/bib.bib
      -
        name: Add .nojekyll
        run: touch quarto/.nojekyll
      -
        name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: quarto
          folder: quarto
